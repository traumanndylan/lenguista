services:
  database:
    image: mongo:latest
    container_name: lenguista-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./db-data:/data/db

  backend-video:
    build: ./backend-video
    container_name: lenguista-video
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend-video:/app
      - /app/node_modules

  backend-classroom:
    build: ./backend-classroom
    container_name: lenguista-classroom
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./backend-classroom:/app
      - /app/node_modules
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: lenguista-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-video
      - backend-classroom
